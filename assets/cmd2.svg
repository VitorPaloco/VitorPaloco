<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  
      <defs>
        <linearGradient id="professionalHeaderGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#1a252f;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="professionalBodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#0c1220;stop-opacity:1" />
        </linearGradient>
        <filter id="professionalShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="rgba(0,0,0,0.6)"/>
        </filter>
        <filter id="professionalGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
          <feMerge> 
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="subtleGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="1" result="glow"/>
          <feMerge>
            <feMergeNode in="glow"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <!-- Professional accent line -->
        <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0" />
          <stop offset="20%" style="stop-color:#8b5cf6;stop-opacity:1" />
          <stop offset="80%" style="stop-color:#8b5cf6;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0" />
        </linearGradient>
      </defs>
    
  
      <style>
        /* Enhanced Base Styles with Professional Typography */
        .terminal-bg { 
          fill: #0f172a; 
          stroke: #334155; 
          stroke-width: 1;
          filter: drop-shadow(0 8px 25px rgba(0, 0, 0, 0.15));
        }
        .terminal-header { 
          fill: #1e293b; 
          stroke: #334155; 
          stroke-width: 1;
        }
        .terminal-text { 
          fill: #f8fafc; 
          font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Source Code Pro', 'Menlo', 'Consolas', monospace; 
          font-size: 18px; 
          font-weight: 400;
          text-rendering: optimizeLegibility;
          letter-spacing: 0.05em;
        }
        .terminal-output { 
          fill: #cbd5e1; 
          font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Source Code Pro', 'Menlo', 'Consolas', monospace; 
          font-size: 18px; 
          font-weight: 400;
          text-rendering: optimizeLegibility;
          letter-spacing: 0.05em;
        }
        .terminal-success { 
          fill: #10b981; 
          font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Source Code Pro', 'Menlo', 'Consolas', monospace; 
          font-size: 18px; 
          font-weight: 500;
          
        }
        .terminal-warning { 
          fill: #f59e0b; 
          font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Source Code Pro', 'Menlo', 'Consolas', monospace; 
          font-size: 18px; 
          font-weight: 500;
          
        }
        .terminal-error { 
          fill: #ef4444; 
          font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Source Code Pro', 'Menlo', 'Consolas', monospace; 
          font-size: 18px; 
          font-weight: 500;
          
        }
        .terminal-info { 
          fill: #3b82f6; 
          font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Source Code Pro', 'Menlo', 'Consolas', monospace; 
          font-size: 18px; 
          font-weight: 500;
          
        }
        .terminal-title { 
          fill: #f8fafc; 
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif; 
          font-size: 16px; 
          font-weight: 600;
          letter-spacing: 0.025em;
        }
        .terminal-cursor { 
          fill: #f8fafc; 
          opacity: 1;
        }
        .terminal-prompt { 
          fill: #8b5cf6; 
          font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Source Code Pro', 'Menlo', 'Consolas', monospace; 
          font-size: 18px; 
          font-weight: 600;
        }
        
        /* Enhanced Control Styles */
        .close { fill: #ff5f57; stroke: #e0443e; stroke-width: 0.5; }
        .minimize { fill: #ffbd2e; stroke: #dea123; stroke-width: 0.5; }
        .maximize { fill: #28ca42; stroke: #1aad2f; stroke-width: 0.5; }
        
        /* Professional Theme-specific Effects */
        
        
        
        
        
        
        
          .terminal-bg { 
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.3));
          }
          .terminal-text {
            font-weight: 450;
          }
        
        
        /* Enhanced Cursor Animation */
        .cursor-blink {
          animation: blink 1.2s ease-in-out infinite;
        }
        @keyframes blink {
          0%, 45% { opacity: 1; }
          50%, 95% { opacity: 0.3; }
          100% { opacity: 1; }
        }
        
        /* Smooth Animations */
        text {
          transition: all 0.2s ease-in-out;
        }
        
        /* Accessibility Improvements */
        
      </style>
    
  
  <!-- Terminal container with professional depth -->
  <rect x="0" y="0" width="1200" height="380" rx="12" ry="12" 
        class="terminal-bg" filter="url(#professionalShadow)"/>
  
  
  <!-- Professional header with corporate styling -->
  <rect x="0" y="0" width="1200" height="44" rx="12" ry="12" 
        fill="url(#professionalHeaderGradient)" stroke="#334155" stroke-width="0.5"/>
  <rect x="0" y="32" width="1200" height="12" fill="url(#professionalHeaderGradient)"/>
  
  <!-- Corporate-style window controls -->
  <g class="terminal-controls">
    <circle cx="22" cy="22" r="7" class="close" filter="url(#subtleGlow)"/>
    <circle cx="48" cy="22" r="7" class="minimize" filter="url(#subtleGlow)"/>
    <circle cx="74" cy="22" r="7" class="maximize" filter="url(#subtleGlow)"/>
    
    <!-- Professional control icons -->
    <g opacity="0.9">
      <path d="M18,18 L26,26 M26,18 L18,26" stroke="#2d1a1a" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="44" y1="22" x2="52" y2="22" stroke="#2d2600" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="70" y="18" width="8" height="8" fill="none" stroke="#1a2d1a" stroke-width="1.5" rx="1.5"/>
      <rect x="72" y="16" width="6" height="6" fill="none" stroke="#1a2d1a" stroke-width="1" rx="1"/>
    </g>
  </g>
  
  <!-- Professional title with enhanced typography -->
  <text x="600" y="28" text-anchor="middle" class="terminal-title" 
        style="font-size: 16px; font-weight: 600; letter-spacing: 0.5px; opacity: 0.95;">
    Terminal
  </text>
  
  <!-- Professional accent line -->
  <rect x="32" y="42" width="1136" height="2" fill="url(#accentLine)" opacity="0.8"/>
  
  
  <!-- Professional content area with subtle texture -->
  <rect x="8" y="46" width="1184" height="326" 
        fill="url(#professionalBodyGradient)" rx="10" ry="10" opacity="0.98"/>
  
  <!-- Command animations with professional spacing -->
  
  <text x="26" y="86" class="terminal-text"><tspan opacity="0">$<animate attributeName="opacity" values="0;1" dur="0.03s" begin="-0.0008490778544597427s" fill="freeze"/></tspan><tspan opacity="0"> <animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.04984368972762037s" fill="freeze"/></tspan><tspan opacity="0">g<animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.10466700482541054s" fill="freeze"/></tspan><tspan opacity="0">i<animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.14166548687099048s" fill="freeze"/></tspan><tspan opacity="0">t<animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.20812480040893877s" fill="freeze"/></tspan><tspan opacity="0"> <animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.25526856707286644s" fill="freeze"/></tspan><tspan opacity="0">p<animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.3013634722492344s" fill="freeze"/></tspan><tspan opacity="0">u<animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.3428398310239752s" fill="freeze"/></tspan><tspan opacity="0">s<animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.39339336065827785s" fill="freeze"/></tspan><tspan opacity="0">h<animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.45488702224316957s" fill="freeze"/></tspan><tspan opacity="0"> <animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.5056200416577161s" fill="freeze"/></tspan><tspan opacity="0">o<animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.5526971789811858s" fill="freeze"/></tspan><tspan opacity="0">r<animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.6078043282642043s" fill="freeze"/></tspan><tspan opacity="0">i<animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.6503414386999009s" fill="freeze"/></tspan><tspan opacity="0">g<animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.6909643135585073s" fill="freeze"/></tspan><tspan opacity="0">i<animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.7525619367581292s" fill="freeze"/></tspan><tspan opacity="0">n<animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.8062749135196231s" fill="freeze"/></tspan><tspan opacity="0"> <animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.8507064985629544s" fill="freeze"/></tspan><tspan opacity="0">m<animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.8985990863227926s" fill="freeze"/></tspan><tspan opacity="0">a<animate attributeName="opacity" values="0;1" dur="0.03s" begin="0.9430464023527908s" fill="freeze"/></tspan><tspan opacity="0">i<animate attributeName="opacity" values="0;1" dur="0.03s" begin="1.0079820434634401s" fill="freeze"/></tspan><tspan opacity="0">n<animate attributeName="opacity" values="0;1" dur="0.03s" begin="1.051864373442704s" fill="freeze"/></tspan>
  </text>
  <text x="26" y="120.8" class="terminal-output" opacity="0">
    Enumerating objects: 9, done.
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.1s" 
             begin="2.1s" 
             fill="freeze"/>
  </text>
  <text x="26" y="153.6" class="terminal-output" opacity="0">
    Counting objects: 100% (9/9), done.
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.1s" 
             begin="2.5s" 
             fill="freeze"/>
  </text>
  <text x="26" y="186.39999999999998" class="terminal-output" opacity="0">
    Delta compression using up to 8 threads
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.1s" 
             begin="2.8s" 
             fill="freeze"/>
  </text>
  <text x="26" y="219.2" class="terminal-output" opacity="0">
    Compressing objects: 100% (5/5), done.
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.1s" 
             begin="3.1s" 
             fill="freeze"/>
  </text>
  <text x="26" y="252" class="terminal-output" opacity="0">
    Writing objects: 100% (5/5), 1.23 KiB | 1.23 MiB/s, done.
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.1s" 
             begin="3.5s" 
             fill="freeze"/>
  </text>
  <text x="26" y="284.8" class="terminal-output" opacity="0">
    Total 5 (delta 3), reused 0 (delta 0), pack-reused 0
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.1s" 
             begin="3.8s" 
             fill="freeze"/>
  </text>
  <text x="26" y="317.6" class="terminal-success" opacity="0">
    To github.com:user/repo.git
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.1s" 
             begin="4.3s" 
             fill="freeze"/>
  </text>
  <text x="26" y="350.40000000000003" class="terminal-success" opacity="0">
       c9b5afa..2fac72b  main -&gt; main
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.1s" 
             begin="4.5s" 
             fill="freeze"/>
  </text>
  
  <!-- Professional cursor with subtle glow -->
  
  <rect x="47.599999999999994" y="385.20000000000005" width="2" height="20" 
        class="terminal-cursor cursor-blink" filter="url(#professionalGlow)" rx="1"/>
  
  
  <!-- Professional border highlighting -->
  <rect x="1" y="1" width="1198" height="378" rx="11" ry="11" 
        fill="none" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="11.5" ry="11.5" 
        fill="none" stroke="rgba(248,250,252,0.1)" stroke-width="0.5"/>
</svg>